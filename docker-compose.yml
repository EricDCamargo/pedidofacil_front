version: '3.8'

services:
  frontend:
    container_name: pedidofacil_frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: .env
    networks:
      - pedidofacilapi_default
    restart: unless-stopped

networks:
  pedidofacilapi_default:
    external: true
